<div class="paper-container" style="margin-left: 0;">
<div style="width: 100%; max-width: 900px;">

  <h1 style="margin: 32px 0 8px;">Admin</h1>
  <p style="color: #666; margin-bottom: 32px;">Manage partners, branding, and plan settings.</p>

  <!-- ─── Partner Management ─── -->
  <div class="dash-card" style="margin-bottom: 24px;">
    <h3>Partners</h3>
    <p style="font-size: 0.85rem; color: #666; margin-bottom: 16px;">
      Current consensus: <strong>{{consensusDisplay}}</strong> votes needed
      ({{eligibleCount}} vote-eligible partner{{#if eligibleCount}}s{{/if}})
    </p>

    <div id="partner-list" hx-get="/admin/partners" hx-trigger="partnersUpdated from:body" hx-swap="innerHTML">
      {{> partner-list}}
    </div>

    <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid #eee;">
      <h4 style="font-size: 0.85rem; color: #888; text-transform: uppercase; margin-bottom: 12px;">Add Partner</h4>
      <form hx-post="/admin/partners/add" hx-swap="none" style="display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end;">
        <div style="flex: 1; min-width: 200px;">
          <label style="font-size: 0.8rem; color: #666; display: block; margin-bottom: 4px;">Email</label>
          <input type="email" name="email" placeholder="partner@example.com" required
                 style="width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem;">
        </div>
        <div style="flex: 1; min-width: 150px;">
          <label style="font-size: 0.8rem; color: #666; display: block; margin-bottom: 4px;">Name</label>
          <input type="text" name="name" placeholder="Their name"
                 style="width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem;">
        </div>
        <div style="min-width: 120px;">
          <label style="font-size: 0.8rem; color: #666; display: block; margin-bottom: 4px;">Role</label>
          <select name="role" style="width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem;">
            <option value="partner">Partner</option>
            <option value="viewer">Viewer</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button type="submit" style="padding: 8px 20px; background: var(--accent, #1565c0); color: #fff; border: none; border-radius: 6px; font-size: 0.9rem; cursor: pointer; font-weight: 600; height: 38px;">Add</button>
      </form>
    </div>
  </div>

  <!-- ─── Branding ─── -->
  <div class="dash-card" style="margin-bottom: 24px;">
    <h3>Branding</h3>
    <form method="POST" action="/admin/settings" style="display: grid; gap: 16px; margin-top: 12px;">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div>
          <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 4px;">App Name</label>
          <input type="text" name="app_name" value="{{settings.app_name}}"
                 style="width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem;">
        </div>
        <div>
          <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 4px;">Document Title</label>
          <input type="text" name="document_title" value="{{settings.document_title}}"
                 style="width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem;">
        </div>
      </div>
      <div>
        <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 4px;">Accent Colour</label>
        <div style="display: flex; gap: 12px; align-items: center;">
          <input type="color" name="accent_color" value="{{settings.accent_color}}"
                 style="width: 50px; height: 36px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; padding: 2px;">
          <span style="font-size: 0.85rem; color: #888;">{{settings.accent_color}}</span>
        </div>
      </div>

      <!-- ─── Plan Settings ─── -->
      <h3 style="margin-top: 8px; padding-top: 16px; border-top: 1px solid #eee;">Plan Settings</h3>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div>
          <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 4px;">Consensus Mode</label>
          <select name="consensus_mode"
                  style="width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem;"
                  onchange="document.getElementById('manual-threshold').style.display = this.value === 'manual' ? 'block' : 'none'">
            <option value="auto" {{#if settings.consensus_auto}}selected{{/if}}>Auto (based on partner count)</option>
            <option value="manual" {{#if settings.consensus_manual}}selected{{/if}}>Manual threshold</option>
          </select>
        </div>
        <div id="manual-threshold" style="{{#if settings.consensus_auto}}display:none{{/if}}">
          <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 4px;">Votes Required</label>
          <input type="number" name="consensus_threshold" value="{{settings.consensus_threshold}}" min="1" max="50"
                 style="width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem;">
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" name="lock_approved" value="true"
                 {{#if settings.lock_approved_checked}}checked{{/if}}
                 style="width: 18px; height: 18px;">
          <span style="font-size: 0.9rem;"><strong>Lock approved sections</strong> — prevent edits after consensus</span>
        </label>
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" name="vote_reset_on_edit" value="true"
                 {{#if settings.vote_reset_checked}}checked{{/if}}
                 style="width: 18px; height: 18px;">
          <span style="font-size: 0.9rem;"><strong>Reset votes on edit</strong> — clear votes when a section is changed</span>
        </label>
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" name="allow_viewer_comments" value="true"
                 {{#if settings.viewer_comments_checked}}checked{{/if}}
                 style="width: 18px; height: 18px;">
          <span style="font-size: 0.9rem;"><strong>Allow viewer comments</strong> — viewers can comment but not vote</span>
        </label>
      </div>

      <div style="padding-top: 8px;">
        <button type="submit" style="padding: 10px 28px; background: var(--accent, #1565c0); color: #fff; border: none; border-radius: 6px; font-size: 0.9rem; cursor: pointer; font-weight: 600;">Save Settings</button>
      </div>
    </form>
  </div>

</div>
</div>
