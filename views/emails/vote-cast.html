<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="border-bottom: 2px solid #1565c0; padding-bottom: 10px; margin-bottom: 20px;">
    <h2 style="margin: 0; color: #1a1a1a;">Exec — Vote Cast</h2>
  </div>
  <p><strong>{{voterName}}</strong> {{voteAction}} <strong>{{sectionTitle}}</strong></p>
  <div style="background: {{voteBg}}; padding: 12px 16px; border-radius: 6px; border-left: 3px solid {{voteColor}}; margin: 16px 0;">
    <p style="margin: 0; font-weight: 600;">Reason:</p>
    <p style="margin: 4px 0 0; color: #333;">{{reason}}</p>
  </div>
  <p style="color: #666; font-size: 14px;">Section status is now <strong>{{status}}</strong>.</p>
</div>
